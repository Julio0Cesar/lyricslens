[package]
name = "lyricslens"
version = "0.1.19"
description = "Synchronized lyrics overlay for the desktop"
edition = "2024"
license = "MIT"
repository = "https://github.com/Julio0Cesar/lyricslens"


[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
gdk4-x11 = "0.11"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
ksni = { version = "0.3.6", features = ["blocking"] }
png = "0.18.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11rb = "0.14.0"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
async-channel = "2.5.0"
futures-util = "0.3.34"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
