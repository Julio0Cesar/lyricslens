name: Dependências de sistema (Linux)
description: >
  Instala o que o Tauri e o LyricsLens precisam para compilar em Ubuntu.
  Fica num lugar só para o CI e a release nunca divergirem.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          libgtk-layer-shell-dev \
          librsvg2-dev \
          libssl-dev \
          patchelf \
          build-essential \
          file \
          wget
