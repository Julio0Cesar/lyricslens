name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# A ordem dos jobs é a correção do #44: o portão de qualidade vem *antes* de a
# release existir, não depois. Empacota → testa em ambiente limpo → só então
# versiona e publica. Enquanto o portão estava depois, uma falha de fumaça
# produzia uma release pública e vazia — pior do que a que ela tentava evitar.
#
# A primeira tentativa de resolver isso foi fazer a release nascer como
# rascunho. Não funciona: **release em rascunho não cria a tag no git**, e a
# release-please usa a tag como âncora para saber até onde já releasou. Sem
# âncora ela re-escaneia o histórico inteiro e propõe uma release nova a cada
# commit que cai no main — um loop que gerou dez releases vazias em sete
# minutos. Daí a inversão de ordem, que não depende de flag nenhuma.
jobs:
  pacotes:
    name: Pacotes Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema
        uses: ./.github/actions/linux-deps

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build
        # O `linuxdeploy`, usado para montar o AppImage, é ele próprio um
        # AppImage — e montá-lo exige libfuse2, que nem o runner nem as
        # distribuições recentes trazem. Extrair em vez de montar dispensa isso.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm tauri build

      # O linuxdeploy empacota o que o binário linka, sem distinguir o que pode
      # viajar do que não pode. Biblioteca da pilha gráfica precisa casar com o
      # driver, o compositor e o Mesa da máquina de destino — e o AppRun põe o
      # `usr/lib/` do pacote na frente do LD_LIBRARY_PATH, então a versão
      # empacotada sequestra a do sistema. Foi assim que a v0.2.1 saiu com uma
      # libwayland velha demais para o Mesa 26, abrindo o overlay em branco.
      #
      # Deliberadamente não mexemos em libc/libstdc++/libgcc: são elas que
      # tornam o AppImage utilizável em distribuição antiga, e não é delas que
      # vem o descasamento com o driver. Ver #30 e #31.
      - name: Enxugar o AppImage
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle/appimage
          origem="$PWD/$(ls "$bundle"/*.AppImage | head -1)"
          echo "antes:  $(du -h "$origem" | cut -f1)"

          trabalho=$(mktemp -d)
          ( cd "$trabalho" && "$origem" --appimage-extract >/dev/null )
          raiz="$trabalho/squashfs-root"

          rm -fv "$raiz"/usr/lib/libwayland-* \
                 "$raiz"/usr/lib/libEGL* \
                 "$raiz"/usr/lib/libGL* \
                 "$raiz"/usr/lib/libgbm* \
                 "$raiz"/usr/lib/libdrm* \
                 "$raiz"/usr/lib/libglapi* \
                 "$raiz"/usr/lib/libX11* || true

          # O hook do linuxdeploy-plugin-gtk força GDK_BACKEND=x11, herdado de
          # um crash do Tauri de 2024. O efeito é o pacote rodar sob XWayland:
          # o binário distribuído não fala Wayland, justamente o contrário do
          # que a arquitetura do app descreve. O .deb e o .rpm nunca tiveram
          # esse hook — só o AppImage divergia. Ver #31.
          hook="$raiz/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          if [ -f "$hook" ]; then
            sed -i 's/^[[:space:]]*export GDK_BACKEND=x11/# GDK_BACKEND=x11 removido: ver #31/' "$hook"
            if ! grep -q 'GDK_BACKEND=x11 removido' "$hook"; then
              echo "::error::não achei o export GDK_BACKEND=x11 no hook — formato mudou, revisar #31"
              exit 1
            fi
          fi

          curl -fsSL -o "$trabalho/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$trabalho/appimagetool"
          rm -f "$origem"
          ARCH=x86_64 "$trabalho/appimagetool" --appimage-extract-and-run "$raiz" "$origem"
          echo "depois: $(du -h "$origem" | cut -f1)"

      # Dez linhas que teriam evitado o #30. Se uma biblioteca da excludelist
      # voltar ao pacote, a release para aqui em vez de sair quebrada.
      - name: Conferir a excludelist do AppImage
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle/appimage
          pacote="$PWD/$(ls "$bundle"/*.AppImage | head -1)"
          trabalho=$(mktemp -d)
          ( cd "$trabalho" && "$pacote" --appimage-extract >/dev/null )
          proibidas=$(ls "$trabalho"/squashfs-root/usr/lib/ 2>/dev/null \
            | grep -E '^(libwayland-|libEGL|libGL|libgbm|libdrm|libglapi|libX11)' || true)
          if [ -n "$proibidas" ]; then
            echo "::error::bibliotecas da excludelist voltaram ao pacote:"
            echo "$proibidas"
            exit 1
          fi
          echo "nenhuma biblioteca da excludelist no pacote."

      - name: Reunir os artefatos
        run: |
          set -euo pipefail
          mkdir -p dist-release
          bundle=src-tauri/target/release/bundle
          cp "$bundle"/appimage/*.AppImage dist-release/lyricslens-x86_64.AppImage
          cp "$bundle"/deb/*.deb          dist-release/lyricslens-x86_64.deb
          cp "$bundle"/rpm/*.rpm          dist-release/lyricslens-x86_64.rpm
          # O instalador precisa do ícone para registrar o app no menu.
          cp src-tauri/icons/128x128.png  dist-release/lyricslens.png
          # O install.sh confere este arquivo antes de extrair o pacote (#29).
          ( cd dist-release && sha256sum ./* > SHA256SUMS && sed -i 's|\./||' SHA256SUMS )
          ls -la dist-release
          cat dist-release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist-release/
          retention-days: 1

  # A v0.2.1 saiu com o AppImage quebrado porque nada no pipeline chegava a
  # instalar o artefato numa máquina que não fosse a de build. Estes testes são
  # deterministas de propósito: instalam pelo caminho exato que o README manda
  # usar, em contêiner limpo e sem dependência pré-instalada, e conferem que
  # todo símbolo dinâmico resolve. Ver #33.
  fumaca:
    name: Instalação em ambiente limpo (${{ matrix.alvo }})
    needs: pacotes
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # `--no-install-recommends` / `install_weak_deps=False` não são só
          # velocidade: o teste pergunta se o pacote **declara** o que o binário
          # precisa, e recommends instalados por tabela podem fazer um símbolo
          # resolver por sorte. Sem eles, só as dependências declaradas contam.
          #
          # `Acquire::Retries` e `Acquire::http::Timeout` são a resposta ao run
          # 30927660642: 22 minutos de silêncio absoluto entre a imagem baixar
          # e o cancelamento manual, sem uma linha do apt. O padrão do apt
          # espera muito tempo por um mirror estagnado; 30s e três tentativas
          # transformam isso em erro rápido em vez de job pendurado.
          - alvo: deb
            imagem: ubuntu:24.04
            instalar: >-
              export DEBIAN_FRONTEND=noninteractive APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30";
              apt-get $APT_OPTS update -qq &&
              apt-get $APT_OPTS install -y --no-install-recommends ./lyricslens-x86_64.deb
          - alvo: rpm
            imagem: fedora:41
            instalar: dnf install -y --setopt=install_weak_deps=False ./lyricslens-x86_64.rpm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-release

      # Sem timeout um travamento consome as seis horas do runner em silêncio.
      # Este passo levou 8min no run 30923464670 — 20 é folga larga, não meta.
      - name: Instalar o pacote e conferir os símbolos
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/pacotes" -w /pacotes ${{ matrix.imagem }} sh -euc '
            echo "--- instalando o pacote"
            ${{ matrix.instalar }}
            echo "--- instalado; conferindo as dependências dinâmicas"
            faltando=$(ldd /usr/bin/lyricslens | grep "not found" || true)
            if [ -n "$faltando" ]; then
              echo "o pacote não declara tudo o que o binário precisa:"
              echo "$faltando"
              exit 1
            fi
            echo "todos os símbolos resolvem."
          '

      # O AppImage traz a pilha do *app* (webkit, gtk, appindicator,
      # gtk-layer-shell) e deliberadamente **não** traz a pilha gráfica —
      # libGL, libEGL, libwayland, libdrm, libgbm, libX11 precisam casar com o
      # driver e o compositor da máquina de destino, e empacotá-las foi o que
      # quebrou a v0.2.1 (#30). Então o contêiner aqui recebe a pilha gráfica,
      # que qualquer desktop tem, e nada do que o AppImage promete trazer
      # dentro: o que faltar depois disso é regressão de empacotamento.
      #
      # A versão anterior deste passo não instalava nada e exigia que tudo
      # resolvesse — as duas metades da política brigando entre si. Nunca
      # chegou a rodar porque o passo anterior falhava antes (#43); assim que
      # ele passou, este reprovou com dezesseis bibliotecas que o AppImage
      # nunca teve a intenção de carregar.
      #
      # Os marcadores `---` existem para o log dizer onde o tempo vai: este
      # passo levou 16min no run 30923464670 instalando dois pacotes minúsculos
      # e extraindo um AppImage, o que não fecha. O `-qq` e o `>/dev/null` de
      # antes escondiam exatamente a informação necessária para descobrir por
      # quê — job lento e silencioso é indistinguível de job travado.
      - name: Conferir que o AppImage traz a pilha do app
        if: matrix.alvo == 'deb'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/pacotes" -w /tmp ubuntu:24.04 sh -euc '
            export DEBIAN_FRONTEND=noninteractive
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
            echo "--- apt-get update"
            apt-get $APT_OPTS update -qq
            echo "--- instalando a pilha gráfica do sistema"
            apt-get $APT_OPTS install -y --no-install-recommends ca-certificates file \
              libgl1 libegl1 libgbm1 libdrm2 \
              libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
              libx11-6 libx11-xcb1 libxcb1 \
              libharfbuzz0b libfontconfig1 libfreetype6 libexpat1 libfribidi0
            echo "--- copiando o AppImage"
            cp /pacotes/lyricslens-x86_64.AppImage .
            chmod +x lyricslens-x86_64.AppImage
            echo "--- extraindo o AppImage"
            ./lyricslens-x86_64.AppImage --appimage-extract >/dev/null
            du -sh /tmp/squashfs-root
            echo "--- conferindo os símbolos com o LD_LIBRARY_PATH que o AppRun monta"
            faltando=$(LD_LIBRARY_PATH=/tmp/squashfs-root/usr/lib \
              ldd /tmp/squashfs-root/usr/bin/lyricslens | grep "not found" || true)
            if [ -n "$faltando" ]; then
              echo "o AppImage deixou de trazer o que precisa trazer:"
              echo "$faltando"
              exit 1
            fi
            echo "o AppImage traz a pilha do app e só depende da pilha gráfica do sistema."
          '

  # Lê os commits desde a última versão, decide o próximo X.Y.Z pelo tipo de
  # cada um (feat → minor, fix → patch, ! → major) e mantém um PR de release
  # aberto com o CHANGELOG. Nada é publicado até esse PR ser aprovado.
  #
  # Roda depois do `fumaca` de propósito: se os pacotes deste commit não passam
  # no ambiente limpo, nem a tag nem a release chegam a existir.
  versao:
    name: Versionamento
    needs: fumaca
    runs-on: ubuntu-22.04
    outputs:
      publicar: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publicar:
    name: Publicar
    needs: [pacotes, fumaca, versao]
    if: needs.versao.outputs.publicar == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-release
          path: dist-release

      - name: Anexar os pacotes à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.versao.outputs.tag }}" dist-release/* --clobber

      # Muita gente chega direto na página de Releases, pelo badge ou por busca,
      # sem passar pelo README — e lá não havia nenhuma instrução de instalação
      # nem indicação de qual dos três arquivos baixar. Ver #28.
      - name: Acrescentar as instruções de instalação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.versao.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > corpo.md
          printf '\n' >> corpo.md
          cat .github/release-footer.md >> corpo.md
          gh release edit "$TAG" --notes-file corpo.md
