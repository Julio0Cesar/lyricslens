name: Release

# Publishes the artefacts install.sh downloads. Runs on a tag, never on a push
# to main: a release is a deliberate act.
on:
  # Called by the workflow that creates the tag. A tag pushed by a workflow
  # does not start another one — GitHub refuses, to keep workflows from
  # triggering each other forever — so the build has to be called, not waited
  # for.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach the artefacts to
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the artefacts to
        required: true
        type: string

permissions:
  contents: write

env:
  LAYER_SHELL: 1.1.0

jobs:
  build:
    name: Build and publish
    # The oldest runner whose GTK and libadwaita are new enough to build
    # against. Everything the binary asks of the system is decided here: build
    # it on a newer one and it stops running on anything older than that one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libx11-dev \
            libwayland-dev \
            wayland-protocols \
            meson \
            ninja-build

      # Ubuntu packaged this one for the first time in 25.10, and the build
      # happens on 24.04. It is small, so it is built here and linked into the
      # program: nothing to install alongside it, and one library fewer to be
      # missing on the machine that runs it.
      - name: Build gtk4-layer-shell into the program
        run: |
          curl -sSL "https://github.com/wmww/gtk4-layer-shell/archive/refs/tags/v$LAYER_SHELL.tar.gz" \
            | tar -xz
          cd "gtk4-layer-shell-$LAYER_SHELL"
          meson setup build \
            --prefix=/usr \
            --default-library=static \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dintrospection=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          SYSTEM_DEPS_GTK4_LAYER_SHELL_0_LINK: static
        run: cargo build --release --locked

      # Built from the same binary the archive carries, so the three ways of
      # installing are the same program.
      - name: Packages for apt and dnf
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb --no-build --no-strip
          cargo generate-rpm

      - name: Assemble the archive
        id: pack
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          dir="lyricslens-$tag-x86_64-linux"
          mkdir -p "$dir/icons"
          cp target/release/lyricslens "$dir/"
          cp packaging/icons/*.png "$dir/icons/"
          cp README.md LICENSE "$dir/"
          cp -r packaging/completions "$dir/"
          # The oldest glibc this binary will run against, read from the
          # binary itself. install.sh checks it before downloading, so a
          # distribution too old to run it is told so instead of being handed
          # a binary that dies on the first symbol.
          objdump -T "target/release/lyricslens" \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -V -u \
            | tail -n 1 \
            | sed 's/GLIBC_//' > MINIMUM_GLIBC

          tar -czf "$dir.tar.gz" "$dir"/*

          # Named the way the release lists them, next to the archive.
          cp target/debian/*.deb "lyricslens-$tag-x86_64.deb"
          cp target/generate-rpm/*.rpm "lyricslens-$tag-x86_64.rpm"

          sha256sum "$dir.tar.gz" *.deb *.rpm > SHA256SUMS
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Created with its files in one go, so the release is never on offer
      # without the archive `--upgrade` goes looking for.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pack.outputs.tag }}"
          archive="${{ steps.pack.outputs.archive }}"

          packages=(
            "$archive"
            "lyricslens-$tag-x86_64.deb"
            "lyricslens-$tag-x86_64.rpm"
            SHA256SUMS
            MINIMUM_GLIBC
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${packages[@]}" --clobber
          else
            gh release create "$tag" "${packages[@]}" --title "$tag" --generate-notes
          fi
