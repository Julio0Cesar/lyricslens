name: Release

# Publishes the artefacts install.sh downloads. Runs on a tag, never on a push
# to main: a release is a deliberate act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the artefacts to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libadwaita-1-dev \
            libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Assemble the archive
        id: pack
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          dir="lyricslens-$tag-x86_64-linux"
          mkdir -p "$dir/icons"
          cp target/release/lyricslens "$dir/"
          cp packaging/icons/*.png "$dir/icons/"
          cp README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"/*
          sha256sum "$dir.tar.gz" > SHA256SUMS
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.pack.outputs.tag }}" \
            "${{ steps.pack.outputs.archive }}" SHA256SUMS --clobber
