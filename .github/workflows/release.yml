name: Release

# Publishes the artefacts install.sh downloads. Runs on a tag, never on a push
# to main: a release is a deliberate act.
on:
  # Called by the workflow that creates the tag. A tag pushed by a workflow
  # does not start another one — GitHub refuses, to keep workflows from
  # triggering each other forever — so the build has to be called, not waited
  # for.
  workflow_call:
    inputs:
      tag:
        description: Tag to build and attach the artefacts to
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the artefacts to
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libgtk4-layer-shell-dev \
            libadwaita-1-dev \
            libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Assemble the archive
        id: pack
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          dir="lyricslens-$tag-x86_64-linux"
          mkdir -p "$dir/icons"
          cp target/release/lyricslens "$dir/"
          cp packaging/icons/*.png "$dir/icons/"
          cp README.md LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"/*
          sha256sum "$dir.tar.gz" > SHA256SUMS
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Created with its files in one go, so the release is never on offer
      # without the archive `--upgrade` goes looking for.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.pack.outputs.tag }}"
          archive="${{ steps.pack.outputs.archive }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" SHA256SUMS --clobber
          else
            gh release create "$tag" "$archive" SHA256SUMS \
              --title "$tag" --generate-notes
          fi
