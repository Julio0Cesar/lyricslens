name: Tag

# Every merge that changes the program is a release.
#
# The version used to be typed by hand in Cargo.toml, and two pull requests
# raising the same line meant one of the two bumps was thrown away by the
# merge — and with it the release. Nothing here is typed: the number comes from
# the last tag.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "install.sh"
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  tag:
    name: Tag the next version
    # The step below commits, which lands here again. Anything the bot wrote is
    # already released.
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version, write it down and tag it
        id: tag
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest=${latest#v}
          latest=${latest:-0.0.0}

          major=${latest%%.*}
          rest=${latest#*.}
          minor=${rest%%.*}
          patch=${rest#*.}

          # A bigger number already in Cargo.toml is deliberate — someone meant
          # this to be a feature or a break. Anything else is the next patch.
          wanted=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          next="$major.$minor.$((patch + 1))"
          if [ "$(printf '%s\n%s\n' "$latest" "$wanted" | sort -V | tail -n 1)" = "$wanted" ] \
             && [ "$wanted" != "$latest" ]; then
            next="$wanted"
          fi

          sed -i "0,/^version = \".*\"/s//version = \"$next\"/" Cargo.toml
          sed -i "s/^pkgver=.*/pkgver=$next/" packaging/PKGBUILD
          # Cargo.lock carries the version too, and a stale one fails the
          # --locked build the release does.
          awk -v v="$next" '
            /^name = "lyricslens"$/ { found = 1 }
            found && /^version = / { sub(/".*"/, "\"" v "\""); found = 0 }
            { print }
          ' Cargo.lock > Cargo.lock.next && mv Cargo.lock.next Cargo.lock

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/PKGBUILD
          # The files can already hold the number — someone wrote it by hand,
          # or a run before this one got as far as writing it. Nothing to
          # commit is not a failure; only a missing tag is.
          if ! git diff --cached --quiet; then
            git commit -m "release $next"
            git push origin HEAD:main
          fi

          git tag -a "v$next" -m "LyricsLens v$next"
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

  # A tag pushed by a workflow starts nothing — GitHub refuses, to keep
  # workflows from triggering each other forever. So the build is called.
  release:
    name: Build the release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
