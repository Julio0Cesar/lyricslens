name: Tag

# A merge that raises the version in Cargo.toml is a release. Without this the
# version sits on main and `lyricslens --upgrade` keeps finding the old one,
# because upgrading downloads the latest release, not the latest commit.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]

permissions:
  contents: write

jobs:
  tag:
    name: Tag the version on main
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag, unless that version is already out
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag="v$version"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tag only. The release is published by the build below, with
          # its files attached — a release that exists without them is one
          # `--upgrade` downloads a 404 from.
          git tag -a "$tag" -m "LyricsLens $tag"
          git push origin "$tag"

  # The tag above cannot start this by itself, so it is called here.
  release:
    name: Build the release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
