name: Repositories

# Publishes an APT and an RPM repository on GitHub Pages, so a machine that
# installed from them gets new versions with the rest of its updates instead of
# being told by a window.
#
# Needs two secrets, both halves of the same signing key:
#   GPG_PRIVATE_KEY    the armoured private key
#   GPG_PASSPHRASE     the passphrase that opens it
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c

      - name: The signing key
        env:
          KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "No signing key: the repositories cannot be published without one." >&2
            exit 1
          fi
          printf '%s' "$KEY" | gpg --batch --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}' > fingerprint

      - name: The packages from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/apt/pool site/rpm
          gh release download --pattern '*.deb' --dir site/apt/pool
          gh release download --pattern '*.rpm' --dir site/rpm

      - name: The apt repository
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd site/apt
          # A flat repository: one directory, no distribution names to keep in
          # step with anybody else's release schedule.
          dpkg-scanpackages --multiversion pool > Packages
          gzip -9 -k -f Packages
          apt-ftparchive release . > Release

          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --armor --detach-sign --output Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --clearsign --output InRelease Release

      - name: The rpm repository
        env:
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd site/rpm
          createrepo_c .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --armor --detach-sign --output repodata/repomd.xml.asc repodata/repomd.xml

      - name: The key and the page
        run: |
          gpg --armor --export "$(cat fingerprint)" > site/lyricslens.asc
          FINGERPRINT=$(sed 's/.\{4\}/& /g' fingerprint) \
            envsubst < packaging/pages/index.html > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
