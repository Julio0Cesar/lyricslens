[package]
name = "lyricslens"
version = "0.8.0" # x-release-please-version
description = "Overlay de letras sincronizadas para o desktop"
authors = ["Julio0Cesar"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Julio0Cesar/lyricslens"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lyricslens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3.33"
thiserror = "2.0.19"
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "gzip", "query"] }
tauri-plugin-single-instance = "2.4.3"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "0.18"

